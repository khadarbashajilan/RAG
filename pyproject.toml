[project]
name = "stoic-rag"
version = "0.1.0"
description = "A Stoic mentor chatbot grounded in Marcus Aurelius' Meditations, via retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "langchain>=1.4.2",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.4.0",
    "langchain-mistralai>=1.1.6",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.0",
    "rich>=15.0.0",
]

[project.scripts]
stoic-rag = "stoic_rag.cli:main"
stoic-rag-ingest = "stoic_rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["stoic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
